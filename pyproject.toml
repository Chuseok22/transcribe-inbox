[project]
name = "transcribe-inbox"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "watchdog>=6.0.0",
    "psycopg[binary]>=3.2",
    "psutil>=6.0",
    "whispermlx>=3.13.1,<4",
]

[project.scripts]
transcribe-inbox = "transcribe_inbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe_inbox"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = ["integration: requires external services (PostgreSQL, whisper-cli, etc.)"]
addopts = "-m 'not integration'"
